name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you start a run manually from the Actions tab

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 src tests

      - name: Run unit tests
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()          # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

  train-model:
    name: Train model
    needs: lint-and-test      # only runs if lint and tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate models
        shell: bash         # bash with pipefail, so a failing script fails this step
        run: python src/train.py 2>&1 | tee train.log

      - name: Smoke-test inference with the trained model
        run: python src/predict.py

      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            train.log
            results/
            models/
            mlruns/
            mlflow.db
