apiVersion: v1
kind: Service
metadata:
  name: heart-api
  labels:
    app: heart-api
spec:
  type: LoadBalancer      # on Minikube, `minikube tunnel` gives it an external IP
  selector:
    app: heart-api
  ports:
    - name: http
      port: 80            # port clients call
      targetPort: 8000    # port the container listens on
